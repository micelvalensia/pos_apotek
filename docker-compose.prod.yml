services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pos_apotek_prod_app
    restart: always
    working_dir: /var/www/html
    environment:
      APP_NAME: 'POS Apotek'
      APP_ENV: production
      APP_KEY: ${APP_KEY:-base64:BqVzH25U5a2cW9a3j1K2+nJ4j7t/8p6F3o9X9x0Z2vA=}
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pos_apotek}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-pos123}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_SAME_SITE: lax
      SESSION_SECURE_COOKIE: 'false'
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pos_network

  web:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: pos_apotek_prod_web
    restart: always
    ports:
      - '8080:80'
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - pos_network

  db:
    image: mysql:8.0
    container_name: pos_apotek_prod_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-pos123}}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${DB_DATABASE:-pos_apotek}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pos_network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-${DB_PASSWORD:-pos123}}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  pos_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
